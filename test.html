<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Test Google Login</title>
    <!-- Load thư viện Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .success { background: #d4edda; color: #155724; }
      .error   { background: #f8d7da; color: #721c24; }
    </style>
  </head>

  <body>
    <h2>Test đăng nhập Google</h2>

    <!-- Nút đăng nhập Google sẽ render vào đây -->
    <div id="google-btn"></div>

    <div id="result">Chưa đăng nhập...</div>

    <script>
      // Thay bằng GOOGLE_CLIENT_ID thật của bạn trong .env
      const GOOGLE_CLIENT_ID = "665576123084-76rrv491u6jbsvtt5gqrqg9oo7esvcsh.apps.googleusercontent.com";

      // URL backend của bạn
      const BACKEND_URL = "http://localhost:5000/api/auth/google";

      window.onload = () => {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,

          // Hàm callback nhận ID Token sau khi user chọn tài khoản Google
          callback: async (response) => {
            const idToken = response.credential;

            const resultDiv = document.getElementById("result");
            resultDiv.className = "";
            resultDiv.textContent = "Đang gửi token về backend...";

            try {
              // Gửi ID Token về backend để verify
              const res = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ idToken }),
              });

              const data = await res.json();

              if (data.success) {
                resultDiv.className = "success";
                resultDiv.textContent =
                  "✅ Đăng nhập thành công!\n\n" + JSON.stringify(data, null, 2);
              } else {
                resultDiv.className = "error";
                resultDiv.textContent =
                  "❌ Thất bại!\n\n" + JSON.stringify(data, null, 2);
              }
            } catch (err) {
              resultDiv.className = "error";
              resultDiv.textContent = "❌ Lỗi kết nối backend:\n" + err.message;
            }
          },
        });

        // Render nút Google Sign-In
        google.accounts.id.renderButton(
          document.getElementById("google-btn"),
          { theme: "outline", size: "large", text: "signin_with", locale: "vi" }
        );
      };
    </script>
  </body>
</html>
